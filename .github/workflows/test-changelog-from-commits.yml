name: test changelog from commits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the action
        id: changelog
        uses: hashemallaham963/gh-actions/changelog-from-commits@main
        # uses: ./changelog-from-commits

      - name: Show outputs
        env:
          STATUS: ${{ steps.changelog.outputs.status }}
          ASSET_URL: ${{ steps.changelog.outputs.asset_url }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          echo "status: $STATUS"
          echo "asset_url: $ASSET_URL"
          echo "changelog:"
          echo "$CHANGELOG"

      - name: Verify success
        env:
          STATUS: ${{ steps.changelog.outputs.status }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          if [ "$STATUS" != "success" ]; then
            echo "❌ action reported: $STATUS"
            exit 1
          fi
          if [ -z "$CHANGELOG" ]; then
            echo "❌ changelog is empty"
            exit 1
          fi
          echo "✅ action test passed"
