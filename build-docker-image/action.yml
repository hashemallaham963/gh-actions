# Information:
name: build docker image
description: "Build a Docker image with Buildx using parameterized platform, tags, registry cache, load and output options"
branding:
  icon: 'message-square'
  color: 'blue'

# Inputs:
inputs:
  working-directory:
    description: 'Directory to enter before running the build'
    required: false
    default: '.'
  context:
    description: 'Build context path passed to buildx (relative to working-directory)'
    required: false
    default: '.'
  platforms:
    description: 'Comma-separated target platforms (e.g. linux/amd64,linux/arm64)'
    required: false
    default: 'linux/amd64'
  tags:
    description: 'Image tag(s) to apply, one per line; use fully qualified tags when publishing later'
    required: true
  cache-ref:
    description: 'Optional registry cache reference (e.g. ghcr.io/org/app:buildcache); enables registry cache import and export'
    required: false
    default: ''
  load:
    description: 'Load a single-platform result into the local Docker daemon'
    required: false
    default: 'true'
  output:
    description: 'Buildx --output value (e.g. type=image); empty omits the flag'
    required: false
    default: 'type=image'


# Logic:
runs:
  using: "composite"
  steps:
    - name: build image
      id: build
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CONTEXT: ${{ inputs.context }}
        PLATFORMS: ${{ inputs.platforms }}
        TAGS: ${{ inputs.tags }}
        CACHE_REF: ${{ inputs.cache-ref }}
        LOAD: ${{ inputs.load }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -e
        trap 'echo "status=failed" >> "$GITHUB_OUTPUT"' ERR

        if [ ! -d "$WORKING_DIRECTORY" ]; then
          echo "❌ Working directory not found: $WORKING_DIRECTORY"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        if [ -z "$TAGS" ]; then
          echo "❌ No image tags provided"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        if ! command -v docker >/dev/null 2>&1; then
          echo "❌ docker command not found — run install-docker first"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        CACHE_REF="${CACHE_REF#"${CACHE_REF%%[![:space:]]*}"}"
        CACHE_REF="${CACHE_REF%"${CACHE_REF##*[![:space:]]}"}"
        if [[ "$CACHE_REF" =~ [[:space:]] ]]; then
          echo "❌ cache-ref must not contain whitespace: $CACHE_REF"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        cd "$WORKING_DIRECTORY"

        if [ ! -e "$CONTEXT" ]; then
          echo "❌ Build context not found: $WORKING_DIRECTORY/$CONTEXT"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        ARGS=()
        if [ -n "$PLATFORMS" ]; then
          ARGS+=(--platform "$PLATFORMS")
        fi

        FIRST_TAG=""
        while IFS= read -r tag || [ -n "$tag" ]; do
          tag="${tag#"${tag%%[![:space:]]*}"}"
          tag="${tag%"${tag##*[![:space:]]}"}"
          if [ -z "$tag" ]; then
            continue
          fi
          if [[ "$tag" =~ [[:space:]] ]]; then
            echo "❌ Image tag must not contain whitespace: $tag"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$FIRST_TAG" ]; then
            FIRST_TAG="$tag"
          fi
          ARGS+=(--tag "$tag")
        done <<< "$TAGS"

        if [ -z "$FIRST_TAG" ]; then
          echo "❌ No image tags provided"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        if [ -n "$CACHE_REF" ]; then
          ARGS+=(--cache-from "type=registry,ref=$CACHE_REF")
          ARGS+=(--cache-to "type=registry,ref=$CACHE_REF,mode=max")
        fi

        if [ "$LOAD" = "true" ]; then
          ARGS+=(--load)
        fi
        if [ -n "$OUTPUT" ]; then
          ARGS+=(--output "$OUTPUT")
        fi
        ARGS+=("$CONTEXT")

        echo "🐳 Building $FIRST_TAG for $PLATFORMS (context: $CONTEXT)"
        if [ -n "$CACHE_REF" ]; then
          echo "📦 Using registry cache: $CACHE_REF"
        fi
        docker buildx build "${ARGS[@]}"

        echo "image=$FIRST_TAG" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "✅ Image built: $FIRST_TAG"

# Outputs:
outputs:
  status:
    description: 'Status of the operation'
    value: ${{ steps.build.outputs.status }}
  image:
    description: 'First tag applied to the build'
    value: ${{ steps.build.outputs.image }}
