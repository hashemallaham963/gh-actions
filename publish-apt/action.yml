# Information:
name: publish to APT repository
description: "Pushing .deb packages to Sonatype Nexus APT repository"
branding:
  icon: 'message-square'
  color: 'blue'


# Inputs:
inputs:
  repository_url:
    description: 'The Nexus APT repository URL'
    required: true
  repository_username:
    description: 'The username'
    required: true
    default: 'admin'
  repository_password:
    description: 'The password'
    required: true
  package_path:
    description: 'The .deb file absolute path on the runner filesystem'
    required: true
  repository_hostname:
    description: 'The domain name of the repository in case we used IP address in the repository_url input'
    required: false


# Logic:
runs:
  using: "composite"
  steps:
    - name: setup dependencies
      id: step1
      shell: bash
      run: |
        echo "install dependencies"
        if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y curl
        else
            echo "❌ apt-get not found"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
        fi

    - name: publish .deb file
      id: step2
      shell: bash
      env:
        REPOSITORY_URL: ${{ inputs.repository_url }}
        REPOSITORY_USERNAME: ${{ inputs.repository_username }}
        REPOSITORY_PASSWORD: ${{ inputs.repository_password }}
        PACKAGE_PATH: ${{ inputs.package_path }}
        REPOSITORY_HOSTNAME: ${{ inputs.repository_hostname }}
      run: |
        # fail-fast on any error
        trap 'echo "status=failed" >> "$GITHUB_OUTPUT"' ERR

        # verify curl exists
        if ! command -v curl &> /dev/null; then
            echo "❌ curl is not installed"
            exit 1
        fi

        # verify package file exists
        if [[ ! -f "$PACKAGE_PATH" ]]; then
            echo "❌ Package not found: $PACKAGE_PATH"
            exit 1
        fi

        echo "Publishing $PACKAGE_PATH to $REPOSITORY_URL"

        # build curl command
        CURL_CMD=(
          curl -sS -f --max-time 60
          -u "$REPOSITORY_USERNAME:$REPOSITORY_PASSWORD"
          -H "Content-Type: multipart/form-data"
          --data-binary "@$PACKAGE_PATH"
        )

        if [[ -n "$REPOSITORY_HOSTNAME" ]]; then
          CURL_CMD+=(-H "Host: $REPOSITORY_HOSTNAME")
        fi

        CURL_CMD+=("$REPOSITORY_URL")

        # execute and capture HTTP code
        HTTP_CODE=$("${CURL_CMD[@]}" -w "%{http_code}" -o /dev/null)

        if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
          echo "✅ Published successfully (HTTP $HTTP_CODE)"
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "❌ Publish failed with HTTP $HTTP_CODE"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi


# Outputs:
outputs:
  status:
    description: 'Status of the action execution'
    value: ${{ steps.step2.outputs.status }}