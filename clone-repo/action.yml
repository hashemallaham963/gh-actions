
# Information:
name: clone git repo
description: "Cloning a Git repository to the current working directory on runner"
branding:
  icon: 'message-square'
  color: 'blue'


# Inputs:
inputs:
  repository_url:
    description: 'The GIT repository URL'
    required: true

  token:
    description: 'The access token, e.g: PAT. Leave empty for public repositories'
    required: false
    default: ''

  depth:
    description: 'The depth of the clone'
    required: false
    default: 1

  branch:
    description: 'The branch name'
    required: false
    default: "main"
  

# Logic
runs:
  using: "composite"
  steps:
    - name: setup dependencies
      id: step1
      shell: bash
      run: |
        echo "install dependencies"
        # check if git is installed on the runner
        if ! command -v git >/dev/null 2>&1; then
            echo "Installing git..."
            sudo apt update
            sudo apt-get install -y git
        fi


    - name: cloning the repo
      id: clone
      shell: bash
      env:
        # translate action's input into step's environment variables
        REPOSITORY_URL: ${{ inputs.repository_url }}
        TOKEN: ${{ inputs.token }}
        DEPTH: ${{ inputs.depth }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -e
        trap 'echo "status=failed" >> "$GITHUB_OUTPUT"' ERR

        if [ -z "$REPOSITORY_URL" ]; then
          echo "❌ repository_url is required"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        if [ -z "$BRANCH" ]; then
          BRANCH="main"
        fi

        if [ -n "$TOKEN" ]; then
          REPOSITORY_URL_WITHOUT_HTTPS_PREFIX="${REPOSITORY_URL#https://}"
          URL="https://x-access-token:${TOKEN}@${REPOSITORY_URL_WITHOUT_HTTPS_PREFIX}"
        else
          URL="$REPOSITORY_URL"
        fi

        DEPTH_ARGS=()
        if [ -n "$DEPTH" ]; then
          if ! [[ "$DEPTH" =~ ^[0-9]+$ ]]; then
            echo "❌ depth must be a number or empty: $DEPTH"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$DEPTH" != "0" ]; then
            DEPTH_ARGS=(--depth "$DEPTH")
          fi
        fi

        echo "Cloning repository..."
        echo "URL: $REPOSITORY_URL"
        echo "Branch: $BRANCH"
        echo "Depth: ${DEPTH:-full}"

        git clone "${DEPTH_ARGS[@]}" --single-branch --branch "$BRANCH" "$URL"

        echo "✅ Clone completed"
        echo "status=success" >> "$GITHUB_OUTPUT"

# Outputs:
outputs:
  status:
    description: 'Status of the operation'
    value: ${{ steps.clone.outputs.status }}