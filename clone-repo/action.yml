
# Information:
name: clone git repo
description: "Cloning a Git repository to the current working directory on runner"
branding:
  icon: 'message-square'
  color: 'blue'


# Inputs:
inputs:
  repository_url:
    description: 'The GIT repository URL'
    required: true

  token:
    description: 'The access token, e.g: PAT'
    required: false
    default: "dummytoken-to-enable-public-repo-clone"

  depth:
    description: 'The depth of the clone'
    required: false
    default: 1

  branch:
    description: 'The branch name'
    required: false
    default: "main"
  

# Outputs:
outputs:
  status:
    description: 'Status of the operation'
    value: ${{ steps.clone.outputs.status }}


# Logic
runs:
  using: "composite"
  steps:
    - name: setup dependencies
      id: step1
      shell: bash
      run: |
        echo "install dependencies"
        # check if git is installed on runner
        if ! command -v git >/dev/null 2>&1; then
            echo "Installing git..."
            sudo apt update
            sudo apt-get install -y git
        fi


    - name: cloning the repo
      id: clone
      shell: bash
      env:
        REPOSITORY_URL: ${{ inputs.repository_url }}
        TOKEN: ${{ inputs.token }}
        DEPTH: ${{ inputs.depth }}
        BRANCH: ${{ inputs.branch }}
      run: |
        echo ""

        trap 'echo "status=failed" >> "$GITHUB_OUTPUT"' ERR

        echo "Cloning repository..."
        echo "URL: $REPOSITORY_URL"
        echo "Branch: $BRANCH"
        echo "Depth: $DEPTH"

        if [ -n "$TOKEN" ]; then
          AUTH_URL="https://x-access-token:${TOKEN}@${REPOSITORY_URL#https://}"
        else
          AUTH_URL="$REPOSITORY_URL"
        fi

        # === cloning:
        git clone \
        --depth ${{ inputs.depth }} \
        --single-branch \
        --branch main \
        "$AUTH_URL"


        # === validation:
        echo "🤔 Validating..."
        echo "Current working directory: $(pwd)"
        
        echo "Listing files:"
        echo "--------------"
        ls -la

        exitstatus=$?
        if [ $exitstatus = 0 ]; then
          echo "✅ success"
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "❌ failed"
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi