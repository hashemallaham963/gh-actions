
# Information:
name: clone git repo
description: "Cloning a Git repository to the current working directory on runner"
branding:
  icon: 'message-square'
  color: 'blue'


# Inputs:
inputs:
  repository_url:
    description: 'The GIT repository URL'
    required: true

  token:
    description: 'The access token, e.g: PAT'
    required: false
    default: "dummytoken-to-enable-public-repo-clone"

  depth:
    description: 'The depth of the clone'
    required: false
    default: 1

  branch:
    description: 'The branch name'
    required: false
    default: "main"
  

# Logic
runs:
  using: "composite"
  steps:
    - name: setup dependencies
      id: step1
      shell: bash
      run: |
        echo "install dependencies"
        # check if git is installed on the runner
        if ! command -v git >/dev/null 2>&1; then
            echo "Installing git..."
            sudo apt update
            sudo apt-get install -y git
        fi


    - name: cloning the repo
      id: clone
      shell: bash
      env:
        # translate action's input into step's environment variables
        REPOSITORY_URL: ${{ inputs.repository_url }}
        TOKEN: ${{ inputs.token }}
        DEPTH: ${{ inputs.depth }}
        BRANCH: ${{ inputs.branch }}
      run: |
        echo ""

        # when an 'ERR' occurs, store 'failed' in ${{ steps.clone.outputs.status }} --> the output 'status' will have 'failed' value
        trap 'echo "status=failed" >> "$GITHUB_OUTPUT"' ERR

        echo "Cloning repository..."
        echo "URL: $REPOSITORY_URL"
        echo "Branch: $BRANCH"
        echo "Depth: $DEPTH"

        REPOSITORY_URL_WITHOUT_HTTPS_PREFIX=${REPOSITORY_URL#https://}

        # no branch is passed in inputs --> fallback to 'main' as a default value
        if [ -z "$BRANCH" ]; then
          BRANCH="main"
        fi

        # a token is passed in the inputs --> use it with auth, otherwise clone without auth
        if [ -n "$TOKEN" ]; then
          URL="https://x-access-token:${TOKEN}@${REPOSITORY_URL_WITHOUT_HTTPS_PREFIX}"
        else
          URL="$REPOSITORY_URL"
        fi

        # === cloning:
        git clone \
        --depth ${{ inputs.depth }} \
        --single-branch \
        --branch $BRANCH \
        "$URL"


        # === validation:
        echo "🤔 Validating..."
        echo "Current working directory: $(pwd)"
        
        echo "Listing files:"
        echo "--------------"
        ls -la

        exitstatus=$?
        if [ $exitstatus = 0 ]; then
          echo "✅ success"
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "❌ failed"
          echo "status=failed" >> "$GITHUB_OUTPUT"
        fi

# Outputs:
outputs:
  status:
    description: 'Status of the operation'
    value: ${{ steps.clone.outputs.status }}