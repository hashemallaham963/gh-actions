
# Information:
name: extract version from release
description: "extract version from release"
branding:
  icon: 'message-square'
  color: 'blue'

# Inputs:
inputs:
  mode:
    description: 'Extraction mode: "simple" or "advanced"'
    required: false
    default: 'advanced'


# Outputs:
outputs:
  version:
    description: 'The release version'
    value: ${{ steps.extract_version.outputs.version }}



# Action Logic:
runs:
  using: "composite"
  steps:
    - name: "extract version from release"
      id: extract_version
      shell: bash
      run: |
        echo "🏷️ Extracting version from triggering workflow..."

        # ─────────────────────────────────────────────
        # SIMPLE mode: highest semver tag on this commit,
        # with branch / latest-release / timestamp fallbacks.
        # ─────────────────────────────────────────────
        simple() {
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Source branch: $BRANCH_NAME"

          COMMIT_SHA="${{ github.sha }}"
          echo "Source commit: $COMMIT_SHA"

          git fetch --tags

          TAG_NAME=$(git tag --points-at $COMMIT_SHA | sort -V | tail -1)
          echo "Found tag: $TAG_NAME"

          VERSION=""

          if [ -n "$TAG_NAME" ]; then
            VERSION=$(echo "$TAG_NAME" | sed -E 's/^(v|release-|rel-)?([0-9]+\.[0-9]+\.[0-9]+).*$/\2/')
            echo "Version from tag: $VERSION"
          fi

          if [ -z "$VERSION" ] && [[ "$BRANCH_NAME" =~ release|rel ]]; then
            VERSION=$(echo "$BRANCH_NAME" | sed -E 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            echo "Version from branch: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "Checking latest GitHub release..."
            LATEST_RELEASE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty')
            if [ -n "$LATEST_RELEASE" ]; then
              VERSION=$(echo "$LATEST_RELEASE" | sed -E 's/^(v|release-|rel-)?([0-9]+\.[0-9]+\.[0-9]+).*$/\2/')
              echo "Version from latest release: $VERSION"
            fi
          fi

          if [ -z "$VERSION" ]; then
            VERSION="0.0.$(date +%Y%m%d)"
            echo "Using fallback version: $VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "⚠️ Invalid version format: $VERSION"
            VERSION="0.0.1"
            echo "Using default version: $VERSION"
          fi

          echo "✅ Final version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        }

        # ─────────────────────────────────────────────
        # ADVANCED mode: prefers tag matching branch name,
        # falls back to highest semver among all tags on
        # this commit, then branch / latest-release /
        # package.json / timestamp fallbacks.
        # ─────────────────────────────────────────────
        advanced() {
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Source branch: $BRANCH_NAME"

          COMMIT_SHA="${{ github.sha }}"
          echo "Source commit: $COMMIT_SHA"

          git fetch --tags

          ALL_TAGS=$(git tag --points-at $COMMIT_SHA)
          echo "All tags at this commit: $ALL_TAGS"

          TAG_NAME=""
          if [ -n "$ALL_TAGS" ]; then
            MATCHING_TAG=$(echo "$ALL_TAGS" | grep -E "^${BRANCH_NAME}$" | head -1)
            if [ -n "$MATCHING_TAG" ]; then
              TAG_NAME="$MATCHING_TAG"
              echo "✅ Found tag matching branch name: $TAG_NAME"
            else
              TAG_NAME=$(echo "$ALL_TAGS" | sort -V | tail -1)
              echo "✅ Using highest version tag: $TAG_NAME"
            fi
          fi

          echo "Found tag: $TAG_NAME"

          VERSION=""

          if [ -n "$TAG_NAME" ]; then
            VERSION=$(echo "$TAG_NAME" | sed -E 's/^(v|release-|rel-)?([0-9]+\.[0-9]+\.[0-9]+).*$/\2/')
            echo "Version from tag: $VERSION"
          fi

          if [ -z "$VERSION" ] && [[ "$BRANCH_NAME" =~ release|rel ]]; then
            VERSION=$(echo "$BRANCH_NAME" | sed -E 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            echo "Version from branch: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "Checking latest GitHub release..."
            LATEST_RELEASE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty')
            if [ -n "$LATEST_RELEASE" ]; then
              VERSION=$(echo "$LATEST_RELEASE" | sed -E 's/^(v|release-|rel-)?([0-9]+\.[0-9]+\.[0-9]+).*$/\2/')
              echo "Version from latest release: $VERSION"
            fi
          fi

          if [ -z "$VERSION" ] && [ -f "package.json" ]; then
            VERSION=$(jq -r '.version // empty' package.json)
            echo "Version from package.json: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            VERSION="0.0.$(date +%Y%m%d)"
            echo "Using fallback version: $VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "⚠️ Invalid version format: $VERSION"
            VERSION="0.0.1"
            echo "Using default version: $VERSION"
          fi

          echo "✅ Final version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        }

        # ─────────────────────────────────────────────
        # Dispatch based on input
        # ─────────────────────────────────────────────
        MODE="${{ inputs.mode }}"
        echo "Mode: $MODE"

        case "$MODE" in
          simple)   simple   ;;
          advanced) advanced ;;
          *)
            echo "⚠️ Unknown mode '$MODE', falling back to advanced"
            advanced
            ;;
        esac
